name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 12 * * 1,4"   # segunda e quinta, 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install supabase

      - name: Ping no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python keepalive.py

      - name: Commit para manter o repositório ativo
        if: success()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last_keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_keepalive.txt
          git commit -m "chore: keepalive" || exit 0
          git push
